<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>飞育教育管理系统 · 离线演示</title>
<style>
/* 飞育教育管理系统 · 样式 */
:root {
  --pri: #1d4ed8;
  --pri-d: #16389f;
  --bg: #f4f6fb;
  --card: #fff;
  --line: #e3e8f2;
  --txt: #1a2333;
  --sub: #7684a0;
  --ok: #16a34a;
  --warn: #d99b0b;
  --err: #cf2f4b;
  --side: #101a33;
  --side-2: #1b2b52;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  color: var(--txt);
  background: var(--bg);
  overflow-x: hidden;
}
a { color: var(--pri); text-decoration: none; }

/* ---------- 侧边栏 ---------- */
#sidebar {
  position: fixed; left: 0; top: 0; bottom: 0; width: 200px;
  background: var(--side); color: #c5cfdf; display: flex; flex-direction: column;
  z-index: 20;
}
.brand {
  padding: 18px 18px 4px; font-size: 18px; font-weight: 700; color: #fff;
  letter-spacing: 1px;
}
.brand-sub { padding: 0 18px 14px; font-size: 11.5px; color: #7d8aa5; }
#nav { flex: 1; overflow-y: auto; padding: 4px 8px; }
#nav a {
  display: flex; align-items: center; gap: 9px; padding: 8px 10px; margin: 1px 0;
  color: #b9c5da; border-radius: 7px; font-size: 13.5px; position: relative;
}
#nav a .ic { width: 18px; text-align: center; font-size: 14px; }
#nav a:hover { background: var(--side-2); color: #fff; }
#nav a.on { background: var(--pri); color: #fff; }
#nav a .badge {
  margin-left: auto; background: var(--err); color: #fff; font-size: 11px;
  min-width: 18px; height: 18px; line-height: 18px; text-align: center;
  border-radius: 9px; padding: 0 5px; font-weight: 600;
}
#nav a.on .badge { background: rgba(255,255,255,.28); }
.side-foot {
  padding: 12px 14px; border-top: 1px solid rgba(255,255,255,.08);
  font-size: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.side-foot span { color: #8ba3a6; flex: 1; min-width: 80px; }

/* ---------- 主区 ---------- */
#main {
  margin-left: 200px; padding: 20px 24px 48px; min-height: 100vh;
}
h2.page { font-size: 19px; margin: 0 0 4px; font-weight: 650; }
.page-desc { color: var(--sub); font-size: 12.5px; margin-bottom: 14px; }

/* ---------- 卡片 ---------- */
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  padding: 16px 18px; margin-bottom: 14px;
}
.card h3 {
  margin: 0 0 12px; font-size: 14.5px; font-weight: 650; display: flex;
  align-items: center; gap: 8px;
}
.card h3 .sub { font-weight: 400; font-size: 12px; color: var(--sub); margin-left: auto; }

/* ---------- KPI ---------- */
.kpis { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.kpi {
  background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  padding: 14px 18px; min-width: 130px; flex: 1;
}
.kpi b { display: block; font-size: 23px; font-weight: 700; line-height: 1.25; }
.kpi span { font-size: 12.5px; color: var(--sub); }
.kpi.ok b { color: var(--ok); }
.kpi.warn b { color: var(--warn); }
.kpi.err b { color: var(--err); }
.kpi.pri b { color: var(--pri); }

/* ---------- 工具条 ---------- */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.btn {
  border: 0; background: var(--pri); color: #fff; padding: 7px 14px;
  border-radius: 7px; font-size: 13px; cursor: pointer; font-family: inherit;
  transition: background .15s;
}
.btn:hover { background: var(--pri-d); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn.ghost { background: #eaf0f1; color: var(--txt); }
.btn.ghost:hover { background: #dfe8e9; }
.btn.danger { background: var(--err); }
.btn.ok { background: var(--ok); }
.btn.sm { padding: 4px 10px; font-size: 12px; }

input, select, textarea {
  font-family: inherit; font-size: 13px; padding: 7px 10px;
  border: 1px solid var(--line); border-radius: 7px; background: #fff;
  color: var(--txt); outline: none; max-width: 100%;
}
input:focus, select:focus, textarea:focus { border-color: var(--pri); }
textarea { resize: vertical; min-height: 84px; width: 100%; }

/* ---------- 表格 ---------- */
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td {
  text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
th { color: var(--sub); font-weight: 600; font-size: 12.5px; background: #f9fbfb; }
tbody tr:hover { background: #f6faf9; }
tr.click { cursor: pointer; }
td.wrap { white-space: normal; min-width: 180px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

.tag {
  display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px;
  background: #eaf0f1; color: var(--sub);
}
.tag.ok { background: #e6f7ec; color: var(--ok); }
.tag.warn { background: #fff5e0; color: var(--warn); }
.tag.err { background: #fdedf0; color: var(--err); }
.tag.pri { background: #e3f4f2; color: var(--pri); }

.empty { color: var(--sub); text-align: center; padding: 44px 12px; font-size: 13px; }

/* ---------- 表单 ---------- */
.fld { display: block; margin-bottom: 12px; }
.fld > span { display: block; font-size: 12.5px; color: var(--sub); margin-bottom: 5px; }
.fld input, .fld select, .fld textarea { width: 100%; }
.fld i { display: block; font-size: 11.5px; color: var(--sub); font-style: normal; margin-top: 3px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 14px; }

/* ---------- 进度条 ---------- */
.bar { background: #eaf0f1; border-radius: 5px; height: 9px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--pri); border-radius: 5px; }
.bar i.warn { background: var(--warn); }
.bar i.err { background: var(--err); }
.bar i.ok { background: var(--ok); }

/* ---------- 竖向柱状图 ---------- */
.chart { display: flex; align-items: flex-end; gap: 10px; height: 190px; padding: 6px 0 0; }
.chart .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end;
  align-items: center; gap: 4px; min-width: 0; }
.chart .col .bars { display: flex; gap: 3px; align-items: flex-end; height: 150px; }
.chart .col .bars i { width: 14px; border-radius: 3px 3px 0 0; background: var(--pri);
  display: block; min-height: 2px; }
.chart .col .bars i.b2 { background: #9ecfc9; }
.chart .col .lb { font-size: 11.5px; color: var(--sub); white-space: nowrap; }
.chart .col .vv { font-size: 11px; color: var(--txt); }

/* ---------- 横向条形排行 ---------- */
.rank { display: flex; flex-direction: column; gap: 9px; }
.rank .r { display: flex; align-items: center; gap: 10px; font-size: 12.5px; }
.rank .r .n { width: 128px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank .r .b { flex: 1; }
.rank .r .v { width: 96px; text-align: right; color: var(--sub);
  font-variant-numeric: tabular-nums; }

/* ---------- 时间线 ---------- */
.tl { position: relative; padding-left: 22px; }
.tl:before {
  content: ''; position: absolute; left: 6px; top: 6px; bottom: 6px;
  width: 2px; background: var(--line);
}
.tl-item { position: relative; padding: 0 0 16px; }
.tl-item:before {
  content: ''; position: absolute; left: -20px; top: 5px; width: 10px; height: 10px;
  border-radius: 50%; background: #fff; border: 2px solid var(--pri);
}
.tl-item.pass:before { border-color: var(--ok); }
.tl-item.reject:before { border-color: var(--err); }
.tl-item .t { font-size: 11.5px; color: var(--sub); }
.tl-item .h { font-weight: 600; font-size: 13.5px; margin: 1px 0; }
.tl-item .d { color: var(--sub); font-size: 12.5px; }

/* ---------- 风险卡片 ---------- */
.risk-list { display: flex; flex-direction: column; gap: 10px; }
.risk-item {
  background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--warn);
  border-radius: 9px; padding: 12px 16px;
}
.risk-item.lv-hi { border-left-color: var(--err); }
.risk-item.lv-mid { border-left-color: var(--warn); }
.risk-item.lv-lo { border-left-color: #9ecfc9; }
.risk-item .h { display: flex; align-items: center; gap: 8px; }
.risk-item .h b { font-size: 13.5px; }
.risk-item .d { color: var(--sub); font-size: 12.5px; margin: 4px 0 0; }

/* ---------- 税率卡 ---------- */
.rate-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.rate-card {
  border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px; background: #fff;
}
.rate-card b { display: block; font-size: 20px; color: var(--pri); }
.rate-card span { font-size: 12px; color: var(--sub); }

/* ---------- 弹层 ---------- */
.modal-mask {
  position: fixed; inset: 0; background: rgba(15, 28, 30, .45); z-index: 60;
  display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px;
  overflow-y: auto;
}
.modal {
  background: #fff; border-radius: 12px; padding: 20px 22px; width: 520px;
  max-width: 100%; box-shadow: 0 16px 48px rgba(0,0,0,.22);
}
.modal.wide { width: 800px; }
.modal h3 { margin: 0 0 14px; font-size: 16px; }
.modal .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.hidden { display: none !important; }

.toast {
  position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%);
  background: #1a2333; color: #fff; padding: 10px 20px; border-radius: 8px;
  font-size: 13px; z-index: 90; box-shadow: 0 8px 24px rgba(0,0,0,.2);
  max-width: 80vw;
}

/* ---------- 结算卡 ---------- */
.settle {
  background: linear-gradient(135deg, #1d4ed8, #3b82f6); color: #fff;
  border-radius: 10px; padding: 16px 20px; margin-bottom: 14px;
}
.settle .row { display: flex; gap: 26px; flex-wrap: wrap; }
.settle .row > div b { display: block; font-size: 21px; font-weight: 700; }
.settle .row > div span { font-size: 12px; opacity: .82; }
.settle .note { margin-top: 10px; font-size: 12px; opacity: .85; }

/* ---------- 登录页 ---------- */
.login-wrap {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #101a33 0%, #1e3a8a 52%, #1d4ed8 130%);
  padding: 20px;
}
.login-box {
  background: #fff; border-radius: 14px; padding: 34px 32px; width: 372px;
  max-width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,.3);
}
.login-box h1 { font-size: 21px; margin: 0 0 4px; }
.login-box p { color: var(--sub); font-size: 12.5px; margin: 0 0 22px; }
.login-box input { width: 100%; margin-bottom: 12px; padding: 10px 12px; }
.login-box .btn { width: 100%; padding: 10px; font-size: 14px; margin-top: 6px; }
.hint { font-size: 11.5px; color: var(--sub); text-align: center; margin-top: 14px;
  line-height: 1.8; }

/* ---------- 移动端 ---------- */
@media (max-width: 820px) {
  #sidebar {
    position: static; width: auto; flex-direction: row; align-items: center;
    overflow-x: auto; padding: 0 8px;
  }
  .brand { padding: 10px 8px; font-size: 15px; white-space: nowrap; }
  .brand-sub { display: none; }
  #nav { display: flex; padding: 6px 0; flex: 1; }
  #nav a { white-space: nowrap; padding: 6px 10px; }
  #nav a .ic { display: none; }
  .side-foot { border: 0; padding: 6px; }
  .side-foot span { display: none; }
  #main { margin-left: 0; padding: 14px 12px 40px; }
  .grid2, .grid3 { grid-template-columns: 1fr; }
  .kpi b { font-size: 20px; }
  .chart { height: 160px; }
  .chart .col .bars { height: 120px; }
}

/* ---------- 飞育扩展 ---------- */
.sub-cell { font-size: 12px; color: var(--sub); max-width: 280px; white-space: normal; }
.rowitem { padding: 8px 4px; border-bottom: 1px dashed var(--line); display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; }
.rowitem.hot b { color: var(--err); }
.rowitem i { margin-left: auto; font-style: normal; font-size: 11.5px; color: var(--sub); }
.rowitem p { width: 100%; margin: 2px 0 0; font-size: 12.5px; color: var(--sub); }
table.week th { text-align: center; padding: 6px 4px; font-size: 12.5px; }
table.week td { border: 1px solid var(--line); padding: 3px; vertical-align: top; height: 46px; }
.slot b { display: block; font-size: 12px; color: var(--pri); }
.slot i { font-style: normal; font-size: 11px; color: var(--sub); }
.card.hot { border-color: #f3c1cb; background: #fff7f8; }
select, input[type=number] { margin-left: 6px; }


.demo-bar{position:fixed;left:0;right:0;top:0;z-index:99;background:#fff8e6;color:#7a5b12;
  border-bottom:1px solid #f0d9a8;font-size:12.5px;padding:7px 16px;text-align:center;
  box-shadow:0 1px 4px rgba(0,0,0,.06)}
.demo-bar b{color:#b8791b}
.demo-bar .who{margin-left:12px;padding-left:12px;border-left:1px solid #f0d9a8}
.demo-bar select{font-size:12.5px;padding:2px 6px;border:1px solid #e0c98f;border-radius:4px;
  background:#fff;color:#7a5b12}
body{padding-top:34px}

</style>
</head>

function normPath(p) {
  p = String(p || '').replace(PREFIX, '');
  if (p.charAt(0) !== '/') p = '/' + p;
  return p;
}
function lookup(p) {
  p = normPath(p);
  if (p === '/api/auth/me') return DEMO_ME;
  if (SNAP[p] !== undefined && SNAP[p] !== null) return SNAP[p];
  var bare = p.split('?')[0];
  if (SNAP[bare] !== undefined && SNAP[bare] !== null) return SNAP[bare];
  /* 带筛选参数的列表：回退到无参数版本 */
  var m = p.match(/^\/api\/students\?/);
  if (m) return SNAP['/api/students'] || {};
  m = p.match(/^\/api\/classes\?/);
  if (m) return SNAP['/api/classes'] || {};
  m = p.match(/^\/api\/scores\?/);
  if (m) return SNAP['/api/scores?term=2026-2027-1'] || {};
  m = p.match(/^\/api\/attendance\/stats\?/);
  if (m) return SNAP['/api/attendance/stats?days=30'] || {};
  m = p.match(/^\/api\/fees\?/);
  if (m) return SNAP['/api/fees'] || {};
  m = p.match(/^\/api\/risks\?/);
  if (m) return SNAP['/api/risks'] || {};
  m = p.match(/^\/api\/policies\?/);
  if (m) return SNAP['/api/policies'] || {};
  m = p.match(/^\/api\/schedule\?/);
  if (m) return SNAP['/api/schedule'] || {};
  m = p.match(/^\/api\/schools\?/);
  if (m) return SNAP['/api/schools'] || {};
  /* 详情：/api/students/ST0001 */
  m = p.match(/^\/api\/students\/([\w\-]+)$/);
  if (m) {
    var hit = ((SNAP['/api/students'] || {}).list || [])
      .filter(function (x) { return x.no === m[1]; })[0];
    if (hit) return Object.assign({}, hit, {scores: [], fees: [], transfers: [],
      attendance: {rate: 0}, gpa: 0, className: '', headTeacher: ''});
  }
  m = p.match(/^\/api\/classes\/([\w\-]+)$/);
  if (m) {
    var cc = ((SNAP['/api/classes'] || {}).list || [])
      .filter(function (x) { return x.no === m[1]; })[0];
    if (cc) return Object.assign({}, cc, {students: [], schedule: []});
  }
  m = p.match(/^\/api\/schools\/([\w\-]+)$/);
  if (m) {
    var ss = ((SNAP['/api/schools'] || {}).list || [])
      .filter(function (x) { return x.code === m[1]; })[0];
    if (ss) return Object.assign({}, ss, {stats: {}});
  }
  return null;
}

window.fetch = function (url, opt) {
  var method = (opt && opt.method) || 'GET';
  var path = String(url).replace(location.origin, '');
  var status = 200, body;
  if (method !== 'GET') {
    body = {code: 200, message: '\u6f14\u793a\u73af\u5883\u53ea\u8bfb\uff0c\u5199\u64cd\u4f5c\u672a\u6267\u884c',
            data: {}};
  } else {
    var data = lookup(path);
    if (data === null || data === undefined) {
      body = {code: 200, message: 'ok', data: []};
    } else {
      body = {code: 200, message: 'ok', data: data};
    }
  }
  return Promise.resolve({
    status: status, ok: true,
    json: function () { return Promise.resolve(body); },
    text: function () { return Promise.resolve(JSON.stringify(body)); }
  });
};

var TOKEN = localStorage.getItem('edu_token') || '';
var ME = JSON.parse(localStorage.getItem('edu_user') || '{}');
var PERMS = ME.perms || [];
var TERM = '2026-2027-1';

function api(method, path, body, raw) {
  return fetch(PREFIX + path, {
    method: method,
    headers: Object.assign({'Content-Type': 'application/json'},
      TOKEN ? {Authorization: 'Bearer ' + TOKEN} : {}),
    body: method === 'POST' ? JSON.stringify(body || {}) : undefined
  }).then(function (r) {
    if (r.status === 401) { localStorage.clear(); location.href = 'login.html'; throw new Error('unauth'); }
    if (r.status >= 400) {
      return r.text().then(function (t) {
        var msg = 'HTTP ' + r.status;
        try { msg = (JSON.parse(t) || {}).message || msg; } catch (e) { /* 非 JSON */ }
        throw new Error(msg);
      });
    }
    return raw ? r.text() : r.json();
  }).then(function (j) {
    if (raw) return j;
    if (j && j.code && j.code !== 200) throw new Error(j.message || ('错误 ' + j.code));
    return j;
  });
}
function GET(p) { return api('GET', p); }
function POST(p, b) { return api('POST', p, b); }
function CSV(p) { return api('GET', p, null, true); }

function toast(msg, err) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = err ? '#cf2f4b' : '#1c2340';
  t.classList.remove('hidden');
  clearTimeout(t._tm);
  t._tm = setTimeout(function () { t.classList.add('hidden'); }, 2600);
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c];
  });
}
function perm(p) { return PERMS.indexOf('*') >= 0 || PERMS.indexOf(p) >= 0; }

/* ---------- 格式化 ---------- */
function fmtMoney(n, noSym) {
  if (n == null || n === '') return '—';
  var v = Number(n);
  var s = Math.abs(v) >= 10000
    ? v.toLocaleString('zh-CN', {maximumFractionDigits: 2})
    : v.toFixed(2);
  return (noSym ? '' : '¥') + s;
}
function fmtWan(n) {
  if (n == null || n === '') return '—';
  var v = Number(n);
  if (Math.abs(v) >= 100000000) return (v / 100000000).toFixed(2) + ' 亿';
  if (Math.abs(v) >= 10000) return (v / 10000).toFixed(2) + ' 万';
  return v.toFixed(2);
}
function fmtPct(x, digits) {
  if (x == null || x === '') return '—';
  return Number(x).toFixed(digits == null ? 2 : digits) + '%';
}
function fmtDate(s) { return s ? String(s).slice(0, 10) : '—'; }
function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

function boot() {
  if (!TOKEN) { location.href = 'login.html'; return; }
  GET('/api/auth/me').then(function (r) {
    ME = r.data || {}; PERMS = ME.perms || [];
    localStorage.setItem('edu_user', JSON.stringify(ME));
    document.getElementById('who').textContent = ME.name + ' · ' + (ME.roleLabel || ME.role);
    var nav = document.getElementById('nav');
    nav.innerHTML = NAV.map(function (n) {
      return '<a href="#/' + n[0] + '" data-k="' + n[0] + '">' +
        '<span class="ic">' + n[2] + '</span>' + n[1] + '</a>';
    }).join('');
    nav.onclick = function (e) {
      var a = e.target.closest('a'); if (!a) return;
      e.preventDefault();
      go(a.getAttribute('data-k'));
    };
    var key = (location.hash || '#/dash').replace('#/', '');
    go(PAGES[key] ? key : 'dash');
    document.getElementById('btn-logout').onclick = function () {
      POST('/api/auth/logout').then(function () {
        localStorage.clear(); location.href = 'login.html';
      }).catch(function () { localStorage.clear(); location.href = 'login.html'; });
    };
    window.addEventListener('hashchange', function () {
      var k = (location.hash || '#/dash').replace('#/', '');
      if (PAGES[k] && k !== CUR) go(k);
    });
    if (perm('risk.read')) {
      GET('/api/dashboard').then(function (d) {
        var n = ((d.data || {}).kpi || {}).riskOpen || 0;

        var a = document.querySelector('#nav a[data-k="risk"]');
        if (a) a.insertAdjacentHTML('beforeend', '<b class="badge">' + n + '</b>');
      }).catch(function () {});
    }
  }).catch(function (e) {
    if (e.message !== 'unauth') location.href = 'login.html';
  });
}

var CUR = null;
function go(key) {
  CUR = key;
  if (location.hash !== '#/' + key) location.hash = '#/' + key;
  document.querySelectorAll('#nav a').forEach(function (a) {
    a.classList.toggle('on', a.getAttribute('data-k') === key);
  });
  var main = document.getElementById('main');
  main.innerHTML = '<div class="empty">加载中…</div>';
  var task;
  try {
    task = PAGES[key](main);
  } catch (e) {
    task = Promise.reject(e);
  }
  Promise.resolve(task).catch(function (e) {
    if (e && e.message === 'unauth') return;
    main.innerHTML = '<div class="empty">加载失败：' + esc(e && e.message) + '</div>';
  });
}

  document.getElementById('modal-mask').classList.add('hidden');
}

function table(headers, rows, rowHtml, empty) {
  if (!rows || !rows.length) return '<div class="empty">' + (empty || '暂无数据') + '</div>';
  return '<div class="tw"><table><thead><tr>' + headers.map(function (h) {
    if (h && h.charAt(0) === '~') return '<th class="num">' + h.slice(1) + '</th>';
    return '<th>' + h + '</th>';
  }).join('') + '</tr></thead><tbody>' + rows.map(rowHtml).join('') + '</tbody></table></div>';
}

function tag(text, cls) {
  return '<span class="tag ' + (cls || '') + '">' + esc(text) + '</span>';
}
function statusTag(s) {
  var m = {'在读': 'ok', '已缴清': 'ok', '已审批': 'ok', '已处理': 'ok',
           '启用': 'ok', '在职': 'ok', '开课': 'ok', '出勤': 'ok',
           '待审批': 'warn', '待缴': 'warn', '部分缴费': 'warn', '迟到': 'warn',
           '休学': '', '已驳回': 'err', '退学': 'err', '转出': 'err', '旷课': 'err',
           '病假': 'warn', '事假': 'warn', '待处理': 'err'};
  return tag(s, m[s] || '');
}
function levelTag(l) {
  var m = {'险': 'err', '警': 'warn', '提': 'pri'};
  return tag(l, m[l] || '');
}
function level2(l) {
  var m = {'优': 'ok', '良': 'pri', '中': 'warn', '及格': '', '不及格': 'err'};
  return tag(l, m[l] || '');
}
function kpi(v, label, cls) {
  return '<div class="kpi ' + (cls || '') + '"><b>' + esc(v) + '</b><span>' + esc(label) + '</span></div>';
}
function field(label, input, hint) {
  return '<label class="fld"><span>' + esc(label) + '</span>' + input +
    (hint ? '<i>' + esc(hint) + '</i>' : '') + '</label>';
}
function bar(pct, cls) {
  var w = Math.max(0, Math.min(100, pct));
  return '<div class="bar"><i class="' + (cls || '') + '" style="width:' + w + '%"></i></div>';
}
function dl(p, name) {
  CSV(p).then(function (t) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([t], {type: 'text/csv;charset=utf-8'}));
    a.download = name || 'export.csv';
    a.click();
  }).catch(function (e) { toast(e.message, true); });
}

/* 通用列表请求（?kw= 等） */
function qs(o) {
  var k = Object.keys(o || {}).filter(function (x) { return o[x]; });
  if (!k.length) return '';
  return '?' + k.map(function (x) { return x + '=' + encodeURIComponent(o[x]); }).join('&');
}

/* 学期下拉 */
function termOptions(sel) {
  var out = [];
  ['2026-2027-1', '2025-2026-2', '2025-2026-1'].forEach(function (t) {
    out.push('<option value="' + t + '"' + (t === sel ? ' selected' : '') + '>' + t + '</option>');
  });
  return out.join('');
}

/* 考试下拉 */
function examOptions(sel) {
  return ['期中', '期末'].map(function (e) {
    return '<option value="' + e + '"' + (e === sel ? ' selected' : '') + '>' + e + '</option>';
  }).join('');
}

/* 竖向双柱图 */
function barChart(rows, labelKey, series, opts) {
  opts = opts || {};
  if (!rows || !rows.length) return '<div class="empty">暂无数据</div>';
  var max = 0;
  rows.forEach(function (r) {
    series.forEach(function (s) {
      max = Math.max(max, Math.abs(Number(r[s.key]) || 0));
    });
  });
  if (!max) max = 1;
  return '<div class="chart">' + rows.map(function (r) {
    var bars = series.map(function (s, i) {
      var v = Math.abs(Number(r[s.key]) || 0);
      var h = Math.max(2, Math.round(v / max * 148));
      return '<i class="' + (i ? 'b2' : '') + '" style="height:' + h + 'px" title="' +
        esc(s.name) + ' ' + v + '"></i>';
    }).join('');
    return '<div class="col"><div class="vv">' + (Number(r[series[0].key]) || 0) +
      '</div><div class="bars">' + bars + '</div><div class="lb">' +
      esc(String(r[labelKey])) + '</div></div>';
  }).join('') + '</div>' +
    '<div class="toolbar" style="margin-top:6px;font-size:12px;color:var(--sub)">' +
    series.map(function (s, i) {
      return '<span style="display:inline-flex;align-items:center;gap:5px">' +
        '<i style="width:10px;height:10px;border-radius:2px;display:inline-block;background:' +
        (i ? '#9db4e8' : 'var(--pri)') + '"></i>' + esc(s.name) + '</span>';
    }).join('') + '</div>';
}

/* 横向排行 */
function rankList(rows, labelKey, valKey, money) {
  if (!rows || !rows.length) return '<div class="empty">暂无数据</div>';
  var max = 0;
  rows.forEach(function (r) { max = Math.max(max, Math.abs(Number(r[valKey]) || 0)); });
  if (!max) max = 1;
  return '<div class="rank">' + rows.map(function (r) {
    var v = Number(r[valKey]) || 0;
    return '<div class="r"><span class="n" title="' + esc(r[labelKey]) + '">' +
      esc(r[labelKey]) + '</span><span class="b">' + bar(Math.abs(v) / max * 100) +
      '</span><span class="v">' + (money === false ? v : fmtMoney(v)) + '</span></div>';
  }).join('') + '</div>';
}

/* 周课表网格 */
function weekGrid(items) {
  var slots = [1, 2, 3, 4, 5];
  var days = ['周一', '周二', '周三', '周四', '周五'];
  var map = {};
  (items || []).forEach(function (it) {
    var k = it.weekday + '-' + it.slot;
    (map[k] = map[k] || []).push(it);
  });
  var head = '<tr><th></th>' + days.map(function (d) { return '<th>' + d + '</th>'; }).join('') + '</tr>';
  var body = slots.map(function (s) {
    return '<tr><th style="width:52px">第' + s + '节</th>' + days.map(function (_, i) {
      var arr = map[(i + 1) + '-' + s] || [];
      return '<td>' + arr.map(function (it) {
        return '<div class="slot"><b>' + esc(it.course || '') + '</b><i>' +
          esc(it.teacher || '') + '</i></div>';
      }).join('') + '</td>';
    }).join('') + '</tr>';
  }).join('');
  return '<div class="tw"><table class="week"><thead>' + head +
    '</thead><tbody>' + body + '</tbody></table></div>';
}

          return '<tr><td><b>' + esc(a.course_name || a.course) + '</b></td><td class="num">' +
            a.count + '</td><td class="num">' + a.avg + '</td><td class="num">' + a.max +
            '</td><td class="num">' + a.min + '</td><td class="num">' + fmtPct(a.pass_rate) +
            '</td><td class="num">' + fmtPct(a.excellent_rate) + '</td><td class="num">' +
            a.stdev + '</td></tr>';
        }) + '</div>' +
        '<div class="card"><h3>' + (cls ? cls + ' ' : '') + '总分排名 TOP10</h3>' +
        table(['名次', '学号', '姓名', '~总分', '~均分', '等级'], rank.slice(0, 10), function (r) {
          return '<tr><td><b>' + r.rank + '</b></td><td>' + esc(r.student_no) + '</td><td>' +
            esc(r.name) + '</td><td class="num">' + r.score + '</td><td class="num">' +
            r.avg + '</td><td>' + level2(r.level) + '</td></tr>';
        }) + '</div></div>';
      ['s-term', 's-exam', 's-cls'].forEach(function (id) {
        document.getElementById(id).onchange = function () {
          term = document.getElementById('s-term').value;
          exam = document.getElementById('s-exam').value;
          cls = document.getElementById('s-cls').value;
          load();
        };
      });
      var btn = document.getElementById('btn-in');
      if (btn) btn.onclick = function () {
        modal('<h3>录入成绩</h3>' +
          field('学号', '<input id="g-no" placeholder="ST0001">') +
          field('课程代码', '<input id="g-course" value="KC001">') +
          field('考试', '<select id="g-exam">' + examOptions('期末') + '</select>') +
          field('成绩', '<input id="g-score" type="number" min="0" max="100">') +
          '<div class="toolbar right"><button class="btn ghost" onclick="closeModal()">取消</button>' +
          '<button class="btn" id="g-save">保存</button></div>');
        document.getElementById('g-save').onclick = function () {
          POST('/api/scores/save', {items: [{
            student_no: document.getElementById('g-no').value.trim(),
            course: document.getElementById('g-course').value.trim(),
            exam: document.getElementById('g-exam').value,
            score: Number(document.getElementById('g-score').value)
          }]}).then(function () { closeModal(); toast('已录入'); load(); })
            .catch(function (e) { toast(e.message, true); });
        };
      };
    });
  }
  return load();
};

/* ---------- 考勤管理 ---------- */
PAGES.attend = function (el) {
  function load(cls) {
    return GET('/api/attendance/stats' + qs({days: 30, class_no: cls})).then(function (r) {
      var d = r.data || {};
      var ov = d.overall || {};
      el.innerHTML =
        '<div class="pagehead"><h2>考勤管理</h2><span class="sub">近 30 天</span><span class="flex"></span>' +
        '<select id="a-cls"><option value="">全部班级</option>' +
        ['CLS001', 'CLS002', 'CLS003', 'CLS004', 'CLS005', 'CLS006', 'CLS007', 'CLS008']
          .map(function (c) { return '<option' + (c === cls ? ' selected' : '') + '>' + c + '</option>'; }).join('') +
        '</select>' +
        (perm('edu.write') ? '<button class="btn" id="btn-att">+ 登记考勤</button>' : '') + '</div>' +
        '<div class="kpis">' +
        kpi(ov.total || 0, '记录数') + kpi(fmtPct(ov.rate), '出勤率') +
        kpi(ov.late || 0, '迟到') + kpi(ov.sick || 0, '病假') +
        kpi(ov.personal || 0, '事假') + kpi(ov.absent_days || 0, '旷课') + '</div>' +
        '<div class="card"><h3>出勤率最低学生</h3>' +
        table(['学号', '姓名', '~出勤率', '~出勤', '~迟到', '~病假', '~事假', '~旷课'],
          (d.byStudent || []).slice(0, 15), function (s) {
          return '<tr><td>' + esc(s.student_no) + '</td><td><b>' + esc(s.name) + '</b></td>' +
            '<td class="num">' + fmtPct(s.rate) + '</td><td class="num">' + s.present +
            '</td><td class="num">' + s.late + '</td><td class="num">' + s.sick +
            '</td><td class="num">' + s.personal + '</td><td class="num">' + s.absent_days +
            '</td></tr>';
        }) + '</div>';
      document.getElementById('a-cls').onchange = function () {
        load(document.getElementById('a-cls').value);
      };
      var btn = document.getElementById('btn-att');
      if (btn) btn.onclick = function () {
        modal('<h3>登记考勤</h3>' +
          field('学号', '<input id="at-no" placeholder="ST0001">') +
          field('状态', '<select id="at-st"><option>出勤</option><option>迟到</option>' +
            '<option>病假</option><option>事假</option><option>旷课</option></select>') +
          '<div class="toolbar right"><button class="btn ghost" onclick="closeModal()">取消</button>' +
          '<button class="btn" id="at-save">保存</button></div>');
        document.getElementById('at-save').onclick = function () {
          POST('/api/attendance/save', {items: [{
            student_no: document.getElementById('at-no').value.trim(),
            status: document.getElementById('at-st').value
          }]}).then(function () { closeModal(); toast('已登记'); load(cls); })
            .catch(function (e) { toast(e.message, true); });
        };
      };
    });
  }
  return load('');
};

/* ---------- 缴费管理 ---------- */
PAGES.fee = function (el) {
  function load() {
    return Promise.all([
      GET('/api/fees/summary'),
      GET('/api/fees?term=2026-2027-1')
    ]).then(function (arr) {
      var s = arr[0].data || {};
      var list = (arr[1].data || {}).list || [];
      el.innerHTML =
        '<div class="pagehead"><h2>缴费管理</h2><span class="sub">学期 ' + esc(s.term || '') +
        '</span><span class="flex"></span>' +
        (perm('fee.write') ? '<button class="btn" id="btn-fee">+ 新建缴费单</button>' : '') +
        (perm('report.read') ? '<button class="btn ghost" id="btn-csv">导出名单</button>' : '') + '</div>' +
        '<div class="kpis">' +
        kpi(s.bills || 0, '缴费单') + kpi(fmtWan(s.total), '应收') +
        kpi(fmtWan(s.paid), '已收') + kpi(fmtWan(s.unpaid), '未收') +
        kpi(fmtPct(s.rate), '收缴率') + kpi(s.overdueCount || 0, '逾期单',
          (s.overdueCount || 0) > 0 ? 'hot' : '') + '</div>' +
        '<div class="card"><h3>缴费明细（' + list.length + '）</h3>' +
        table(['单号', '学号', '学生', '项目', '学期', '~应收', '~已缴', '状态', ''], list.slice(0, 80), function (f) {
          return '<tr><td>' + esc(f.no) + '</td><td>' + esc(f.student_no) + '</td><td>' +
            esc(f.student_name || '') + '</td><td>' + esc(f.item) + '</td><td>' + esc(f.term) +
            '</td><td class="num">' + fmtMoney(f.amount) + '</td><td class="num">' +
            fmtMoney(f.paid_amount) + '</td><td>' + statusTag(f.status) + '</td>' +
            (perm('fee.write') && f.status !== '已缴清'
              ? '<td><button class="btn sm" data-pay="' + esc(f.no) + '">核销</button></td>'
              : '<td></td>') + '</tr>';
        }) + '</div>';
      el.querySelectorAll('button[data-pay]').forEach(function (b) {
        b.onclick = function () {
          POST('/api/fees/pay', {no: b.getAttribute('data-pay'), amount: -1,
            pay_method: '银行转账'}).then(function (r2) {
            toast('核销成功：' + (r2.data || {}).status);
            load();
          }).catch(function (e) { toast(e.message, true); });
        };
      });
      var csv = document.getElementById('btn-csv');
      if (csv) csv.onclick = function () { dl('/api/reports/export', 'students.csv'); };
      var add = document.getElementById('btn-fee');
      if (add) add.onclick = function () {
        modal('<h3>新建缴费单</h3>' +
          field('学号', '<input id="fb-no" placeholder="ST0001">') +
          field('项目', '<input id="fb-item" value="学费">') +
          field('金额', '<input id="fb-amt" type="number" value="6200">') +
          field('折扣(%)', '<input id="fb-dis" type="number" value="0">') +
          '<div class="toolbar right"><button class="btn ghost" onclick="closeModal()">取消</button>' +
          '<button class="btn" id="fb-save">保存</button></div>');
        document.getElementById('fb-save').onclick = function () {
          POST('/api/fees/save', {
            student_no: document.getElementById('fb-no').value.trim(),
            item: document.getElementById('fb-item').value.trim(),
            amount: Number(document.getElementById('fb-amt').value),
            discount: Number(document.getElementById('fb-dis').value),
            term: TERM, due_date: '2026-09-15'
          }).then(function () { closeModal(); toast('已创建'); load(); })
            .catch(function (e) { toast(e.message, true); });
        };
      };
    });
  }
  return load();
};

/* ---------- 统计报表 ---------- */
PAGES.reports = function (el) {
  return GET('/api/reports/summary').then(function (r) {
    var d = r.data || {};
    var ac = d.academic || {};
    var att = d.attendance || {};
    var fee = d.fee || {};
    var t = d.teaching || {};
    el.innerHTML =
      '<div class="pagehead"><h2>统计报表</h2><span class="sub">学期 ' + esc(d.term || '') +
      '</span><span class="flex"></span>' +
      '<button class="btn ghost" id="btn-csv">导出学生 CSV</button></div>' +
      '<div class="grid2">' +
      '<div class="card"><h3>教学规模</h3><div class="toolbar">' +
      kpi(t.students || 0, '学生') + kpi(t.teachers || 0, '教师') +
      kpi(t.classes || 0, '班级') + kpi(t.courses || 0, '课程') + '</div></div>' +
      '<div class="card"><h3>学业概况</h3><div class="toolbar">' +
      kpi(ac.avg || 0, '均分') + kpi(fmtPct(ac.pass_rate), '及格率') +
      kpi(fmtPct(ac.excellent_rate), '优秀率') + kpi(ac.gpa || 0, 'GPA') + '</div></div>' +
      '</div>' +
      '<div class="grid2">' +
      '<div class="card"><h3>考勤概况（近30天）</h3><div class="toolbar">' +
      kpi(fmtPct(att.rate), '出勤率') + kpi(att.late || 0, '迟到') +
      kpi(att.sick || 0, '病假') + kpi(att.absent_days || 0, '旷课') + '</div></div>' +
      '<div class="card"><h3>收费概况</h3><div class="toolbar">' +
      kpi(fmtWan(fee.total), '应收') + kpi(fmtWan(fee.paid), '已收') +
      kpi(fmtWan(fee.unpaid), '未收') + kpi(fmtPct(fee.rate), '收缴率') + '</div></div>' +
      '</div>';
    var csv = document.getElementById('btn-csv');
    if (csv) csv.onclick = function () { dl('/api/reports/export', 'students.csv'); };
  });
};

/* ---------- 预警中心 ---------- */
PAGES.risk = function (el) {
  function load() {
    return GET('/api/risks?status=待处理').then(function (r) {
      var list = (r.data || {}).list || [];
      el.innerHTML =
        '<div class="pagehead"><h2>预警中心</h2><span class="sub">' + list.length +
        ' 条待处理</span><span class="flex"></span>' +
        (perm('risk.read') ? '<button class="btn" id="btn-scan">执行扫描</button>' : '') + '</div>' +
        table(['ID', '校区', '级别', '标题', '详情', '时间', ''], list, function (x) {
          return '<tr><td>' + x.id + '</td><td>' + esc(x.school) + '</td><td>' +
            levelTag(x.level) + '</td><td><b>' + esc(x.title) + '</b></td><td class="sub-cell">' +
            esc(x.detail) + '</td><td>' + fmtDate(x.created_at) + '</td>' +
            '<td><button class="btn sm" data-id="' + x.id + '">处理</button></td></tr>';
        });
      el.querySelectorAll('button[data-id]').forEach(function (b) {
        b.onclick = function () {
          POST('/api/risks/close', {id: Number(b.getAttribute('data-id'))}).then(function () {
            toast('已处理'); load();
          }).catch(function (e) { toast(e.message, true); });
        };
      });
      var scan = document.getElementById('btn-scan');
      if (scan) scan.onclick = function () {
        scan.disabled = true;
        POST('/api/risks/scan', {}).then(function (r2) {
          toast('新增 ' + (r2.data.count || 0) + ' 条'); load();
        }).catch(function (e) { toast(e.message, true); scan.disabled = false; });
      };
    });
  }
  return load();
};

/* ---------- 政策公告 ---------- */
PAGES.policy = function (el) {
  return Promise.all([GET('/api/policies'), GET('/api/notices')]).then(function (arr) {
    var pol = (arr[0].data || {}).list || [];
    var not = arr[1].data || [];

      '<div class="grid2">' +
      '<div class="card"><h3>政策法规</h3>' +
      table(['标题', '分类', '文号', '生效', '状态'], pol, function (p) {
        return '<tr><td><b>' + esc(p.title) + '</b><div class="sub-cell">' + esc(p.summary) +
          '</div></td><td>' + esc(p.category) + '</td><td>' + esc(p.doc_no) + '</td><td>' +
          fmtDate(p.effect_date) + '</td><td>' + statusTag(p.status) + '</td></tr>';
      }) + '</div>' +
      '<div class="card"><h3>校园公告</h3>' + not.map(function (n) {
        return '<div class="rowitem' + (n.top ? ' hot' : '') + '"><b>' +
          (n.top ? '[置顶] ' : '') + esc(n.title) + '</b><p>' + esc(n.body) +
          '</p><i>' + esc(n.author) + ' · ' + fmtDate(n.created_at) + '</i></div>';
      }).join('') + '</div></div>';
  });
};

/* ---------- 系统管理 ---------- */
PAGES.system = function (el) {
  return Promise.all([
    GET('/api/users'), GET('/api/roles'), GET('/api/api-keys'), GET('/api/sync/version')
  ]).then(function (arr) {
    var users = (arr[0].data || {}).list || [];
    var roles = arr[1].data || [];
    var keys = (arr[2].data || {}).list || [];
    var sync = arr[3].data || {};
    el.innerHTML =
      '<div class="grid2">' +
      '<div class="card"><h3>用户与角色</h3>' +
      table(['账号', '姓名', '角色', '部门', '状态'], users, function (u) {
        return '<tr><td>' + esc(u.username) + '</td><td><b>' + esc(u.name) + '</b></td><td>' +
          esc(u.role) + '</td><td>' + esc(u.dept) + '</td><td>' + statusTag(u.status) + '</td></tr>';
      }) + '</div>' +
      '<div class="card"><h3>权限矩阵</h3>' +
      table(['角色', '权限'], roles, function (ro) {
        return '<tr><td><b>' + esc(ro.label) + '</b></td><td>' + ro.perms.map(function (p) {
          return tag(p, p === '*' ? 'err' : 'pri');
        }).join(' ') + '</td></tr>';
      }) + '</div>' +
      '</div>' +
      '<div class="grid2">' +
      '<div class="card"><h3>接口密钥</h3>' +
      table(['名称', '前缀', '权限域', '创建', '状态'], keys, function (k) {
        return '<tr><td>' + esc(k.name) + '</td><td>' + esc(k.prefix) + '</td><td>' +
          esc(k.scope) + '</td><td>' + fmtDate(k.created_at) + '</td><td>' +
          statusTag(k.status) + '</td></tr>';
      }) +
      (perm('system.read') ? '<div class="toolbar right"><button class="btn" id="btn-key">+ 生成密钥</button></div>' : '') +
      '</div>' +
      '<div class="card"><h3>增量同步版本</h3>' +
      table(['实体', '~版本'], Object.keys(sync).map(function (k) {
        return {k: k, v: sync[k]};
      }), function (x) {
        return '<tr><td>' + esc(x.k) + '</td><td class="num">' + x.v + '</td></tr>';
      }) +
      '<div class="toolbar">对接文档：<a href="' + esc(PREFIX) +
      '/api/apidoc" target="_blank">/api/apidoc</a></div></div>' +
      '</div>';
    var bk = document.getElementById('btn-key');
    if (bk) bk.onclick = function () {
      var nm = '对接密钥' + (keys.length + 1);
      POST('/api/api-keys/create', {name: nm, scope: 'read'}).then(function (r) {
        modal('<h3>密钥已生成（仅展示一次）</h3><pre style="white-space:pre-wrap">' +
          esc((r.data || {}).key || '') + '</pre>' +
          '<div class="toolbar right"><button class="btn" onclick="closeModal()">我已保存</button></div>');
      }).catch(function (e) { toast(e.message, true); });
    };
  });
};

</script>
